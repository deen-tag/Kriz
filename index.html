<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kriz</title>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  body {
    background: #0A0E16;
    color: #F3F5F9;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  input::placeholder { color: #5C6579; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  button { font-family: inherit; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .kriz-row-in { animation: rowIn .35s ease-out; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 20px 100px; }
  .period-tabs { display: flex; background: #131A26; border: 1px solid #1E2635; border-radius: 14px; padding: 4px; margin-top: 12px; }
  .period-tab { flex: 1; padding: 9px 0; border-radius: 10px; border: none; cursor: pointer; background: transparent; color: #8892A4; font-size: 13.5px; font-weight: 500; transition: all .2s ease; }
  .period-tab.active { background: #1E2635; color: #F3F5F9; font-weight: 600; }
  .balance-label { color: #8892A4; font-size: 14.5px; margin-bottom: 6px; }
  .balance-value { font-size: 46px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .balance-period { color: #8892A4; font-size: 13.5px; margin-top: 6px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col-card { background: #0F1520; border: 1px solid #1E2635; border-radius: 16px; padding: 14px; min-height: 90px; }
  .col-title { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #8892A4; margin-bottom: 10px; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; }
  .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .row-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-amount { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .empty { color: #8892A4; font-size: 12.5px; }
  .add-zone { margin-top: 22px; background: #131A26; border: 1px solid #1E2635; border-radius: 18px; padding: 16px; }
  .add-row { display: flex; align-items: center; gap: 10px; }
  .action-btn { width: 48px; height: 48px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s ease; background: #1E2635; color: #8892A4; cursor: default; }
  .action-btn.enabled { cursor: pointer; }
  .action-btn.pressed { transform: scale(0.9); }
  .add-input { flex: 1; background: #0E1420; border: 1px solid #1E2635; border-radius: 12px; padding: 11px 12px; color: #F3F5F9; font-size: 14.5px; outline: none; min-width: 0; }
  .hint-row { display: flex; justify-content: space-between; margin-top: 4px; padding: 0 2px; }
  .hint { font-size: 10px; color: #8892A4; letter-spacing: 0.02em; }
  .amount-input { width: 100%; margin-top: 10px; background: #0E1420; border: 1px solid #1E2635; border-radius: 12px; padding: 12px 14px; color: #F3F5F9; font-size: 17px; font-weight: 600; outline: none; box-sizing: border-box; font-variant-numeric: tabular-nums; }
  .tags-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .tag-btn { border: 1px solid #1E2635; background: transparent; color: #8892A4; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: all .15s ease; }
  .tag-btn.active { }
  .tag-btn.dashed { border-style: dashed; }
  .stats-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .stats-row { display: flex; align-items: center; gap: 20px; }
  .donut { width: 120px; height: 120px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .donut-hole { position: absolute; inset: 20px; border-radius: 50%; background: #0A0E16; }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .legend-row { display: flex; justify-content: space-between; font-size: 13.5px; }
  .legend-label { color: #8892A4; display: flex; align-items: center; gap: 8px; }
  .legend-pct { font-weight: 600; }
  .quote { text-align: center; color: #8892A4; font-size: 12.5px; margin-top: 40px; font-style: italic; }
  .bottomnav { position: fixed; bottom: 0; left: 0; right: 0; background: #0D1220; border-top: 1px solid #1E2635; display: flex; justify-content: space-around; padding: 10px 0 14px; }
  .navicon { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8892A4; }
  .navicon.active { color: #3ECF8E; }
  .navicon span { font-size: 10.5px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------- tokens ---------- */
const COLORS = {
  green: "#3ECF8E",
  coral: "#F2634B",
};

const DEFAULT_TAGS = ["Courses", "Maison", "Transport", "Loisirs", "Salaire", "Abonnement", "Restaurant"];

const TAG_COLORS = {
  Courses: "#3ECF8E", Maison: "#7C9CF2", Transport: "#F2B24B", Loisirs: "#B892F2",
  Salaire: "#3ECF8E", Abonnement: "#F2634B", Restaurant: "#F2896B", Autres: "#5A6478",
};

/* ---------- icons (inline SVG strings) ---------- */
const svgIcon = (inner, size = 20) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICONS = {
  plus: svgIcon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 20),
  minus: svgIcon('<line x1="5" y1="12" x2="19" y2="12"/>', 20),
  home: svgIcon('<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'),
  history: svgIcon('<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>'),
  tag: svgIcon('<path d="M20.59 13.41 11 22H2v-9L12.41 3.41A2 2 0 0 1 13.83 3H20a1 1 0 0 1 1 1v6.17a2 2 0 0 1-.59 1.41z"/><circle cx="7" cy="7" r="1.5"/>'),
  settings: svgIcon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  chevronLeft: svgIcon('<polyline points="15 18 9 12 15 6"/>', 18),
  chevronRight: svgIcon('<polyline points="9 18 15 12 9 6"/>', 18),
  arrowUp: svgIcon('<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>', 22),
  arrowDown: svgIcon('<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>', 22),
};

/* ---------- helpers ---------- */
function formatMoney(v) {
  const sign = v < 0 ? "−" : "";
  return `${sign}${Math.abs(v).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`;
}
function inPeriod(dateStr, period, refDate) {
  const d = new Date(dateStr);
  const ref = refDate || new Date();
  if (period === "Semaine") {
    const start = new Date(ref);
    start.setDate(ref.getDate() - ref.getDay());
    start.setHours(0, 0, 0, 0);
    const end = new Date(start);
    end.setDate(start.getDate() + 7);
    return d >= start && d < end;
  }
  if (period === "Mois") return d.getMonth() === ref.getMonth() && d.getFullYear() === ref.getFullYear();
  return d.getFullYear() === ref.getFullYear();
}
function periodLabel(period, refDate) {
  const ref = refDate || new Date();
  if (period === "Semaine") {
    const start = new Date(ref);
    start.setDate(ref.getDate() - ref.getDay());
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    const fmt = (d) => d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    return `${fmt(start)} – ${fmt(end)}`;
  }
  if (period === "Mois")
    return ref.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }).replace(/^./, (c) => c.toUpperCase());
  return String(ref.getFullYear());
}
function shiftRef(period, refDate, dir) {
  const d = new Date(refDate);
  if (period === "Semaine") d.setDate(d.getDate() + dir * 7);
  else if (period === "Mois") d.setMonth(d.getMonth() + dir);
  else d.setFullYear(d.getFullYear() + dir);
  return d;
}
function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

/* ---------- state ---------- */
const state = {
  transactions: [],
  period: "Mois",
  refDate: new Date(),
  label: "",
  amount: "",
  tags: [...DEFAULT_TAGS],
  activeTag: null,
  lastAddedId: null,
};

/* ---------- actions ---------- */
function setPeriod(p) { state.period = p; state.refDate = new Date(); render(); }
function navPeriod(dir) { state.refDate = shiftRef(state.period, state.refDate, dir); render(); }

function submit(type) {
  const amt = parseFloat(String(state.amount).replace(",", "."));
  if (!amt || amt <= 0) return;
  const id = `t${Date.now()}`;
  state.transactions.unshift({
    id,
    label: state.label.trim() || (type === "in" ? "Entrée" : "Sortie"),
    amount: amt,
    type,
    tag: state.activeTag || "Autres",
    date: new Date().toISOString(),
  });
  state.lastAddedId = id;
  state.label = "";
  state.amount = "";
  state.activeTag = null;
  render();
  setTimeout(() => { state.lastAddedId = null; }, 700);
}

function pickTag(t) {
  state.activeTag = t;
  if (!state.label) state.label = t;
  render();
}

function newTag() {
  const name = window.prompt("Nom du nouveau libellé (ex: Vacances)");
  if (name && name.trim()) {
    const clean = name.trim();
    if (!state.tags.includes(clean)) state.tags.push(clean);
    state.activeTag = clean;
    state.label = clean;
    render();
  }
}

function onLabelInput(v) { state.label = v; }
function onAmountInput(v) {
  state.amount = v;
  const enabled = !!v;
  const plusBtn = document.getElementById("btn-plus");
  const minusBtn = document.getElementById("btn-minus");
  if (plusBtn) {
    plusBtn.classList.toggle("enabled", enabled);
    plusBtn.style.background = enabled ? COLORS.green : "#1E2635";
    plusBtn.style.color = enabled ? "#0A0E16" : "#8892A4";
    plusBtn.style.boxShadow = enabled ? `0 0 0 3px ${COLORS.green}22` : "none";
  }
  if (minusBtn) {
    minusBtn.classList.toggle("enabled", enabled);
    minusBtn.style.background = enabled ? COLORS.coral : "#1E2635";
    minusBtn.style.color = enabled ? "#0A0E16" : "#8892A4";
    minusBtn.style.boxShadow = enabled ? `0 0 0 3px ${COLORS.coral}22` : "none";
  }
}

function pressAndSubmit(type, btnId) {
  if (!state.amount) return;
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.classList.add("pressed");
    setTimeout(() => btn.classList.remove("pressed"), 250);
  }
  submit(type);
}

/* ---------- render ---------- */
function render() {
  const filtered = state.transactions
    .filter((t) => inPeriod(t.date, state.period, state.refDate))
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  const entries = filtered.filter((t) => t.type === "in");
  const outs = filtered.filter((t) => t.type === "out");
  const balance = entries.reduce((s, t) => s + t.amount, 0) - outs.reduce((s, t) => s + t.amount, 0);

  const spendMap = {};
  outs.forEach((t) => { spendMap[t.tag] = (spendMap[t.tag] || 0) + t.amount; });
  const spendTotal = Object.values(spendMap).reduce((a, b) => a + b, 0) || 1;
  const spendByTag = Object.entries(spendMap)
    .map(([tag, val]) => ({ tag, val, pct: Math.round((val / spendTotal) * 100) }))
    .sort((a, b) => b.val - a.val);

  const isEmpty = state.transactions.length === 0;
  const amountEnabled = !!state.amount;

  function renderColumn(title, dot, items, sign) {
    const rows = items.slice(0, 6).map((t) => `
      <div class="row ${t.id === state.lastAddedId ? "kriz-row-in" : ""}">
        <span class="row-label">${escapeHtml(t.label)}</span>
        <span class="row-amount" style="color:${dot}">${sign}${t.amount.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €</span>
      </div>`).join("");
    return `
      <div class="col-card">
        <div class="col-title"><span class="dot" style="background:${dot}"></span>${title.toUpperCase()}</div>
        <div style="display:flex;flex-direction:column;gap:9px;">
          ${rows || `<div class="empty">—</div>`}
        </div>
      </div>`;
  }

  function renderDonut() {
    if (!spendByTag.length) return "";
    let acc = 0;
    const stops = spendByTag.map((s) => {
      const from = acc;
      acc += s.pct;
      return `${TAG_COLORS[s.tag] || "#5A6478"} ${from}% ${acc}%`;
    });
    const gradient = `conic-gradient(${stops.join(", ")})`;
    const legend = spendByTag.slice(0, 5).map((s) => `
      <div class="legend-row">
        <span class="legend-label"><span class="dot" style="background:${TAG_COLORS[s.tag] || "#5A6478"}"></span>${escapeHtml(s.tag)}</span>
        <span class="legend-pct">${s.pct}%</span>
      </div>`).join("");
    return `
      <div style="margin-top:28px;">
        <div class="stats-title">Où va mon argent ?</div>
        <div class="stats-row">
          <div class="donut" style="background:${gradient}"><div class="donut-hole"></div></div>
          <div class="legend">${legend}</div>
        </div>
      </div>`;
  }

  const html = `
    <div class="wrap">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:28px 0 8px;">
        <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;">Kriz</div>
      </div>

      <div class="period-tabs">
        ${["Semaine", "Mois", "Année"].map((p) => `
          <button class="period-tab ${state.period === p ? "active" : ""}" data-period="${p}">${p}</button>
        `).join("")}
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;">
        <button id="nav-prev" class="action-btn enabled" style="width:40px;height:40px;background:#131A26;color:#F3F5F9;border:1px solid #1E2635;">${ICONS.chevronLeft}</button>
        <div style="font-size:16px;font-weight:700;">${periodLabel(state.period, state.refDate)}</div>
        <button id="nav-next" class="action-btn enabled" style="width:40px;height:40px;background:#131A26;color:#F3F5F9;border:1px solid #1E2635;">${ICONS.chevronRight}</button>
      </div>

      <div style="text-align:center;padding:24px 0 28px;">
        <div class="balance-label">Il vous reste</div>
        <div class="balance-value" style="color:${balance < 0 ? COLORS.coral : "#F3F5F9"}">${formatMoney(balance)}</div>
      </div>

      ${isEmpty
        ? `<div style="text-align:center;padding:20px 0 32px;">
             <div style="font-size:17px;font-weight:700;margin-bottom:6px;">Commencez votre budget</div>
             <div style="color:#8892A4;font-size:14px;">Ajoutez votre première entrée ou sortie.</div>
           </div>`
        : `<div class="cols">${renderColumn("Entrées", COLORS.green, entries, "+")}${renderColumn("Sorties", COLORS.coral, outs, "−")}</div>`
      }

      <div class="add-zone">
        <div class="add-row">
          <button id="btn-plus" class="action-btn ${amountEnabled ? "enabled" : ""}" style="background:${amountEnabled ? COLORS.green : "#1E2635"};color:${amountEnabled ? "#0A0E16" : "#8892A4"};box-shadow:${amountEnabled ? `0 0 0 3px ${COLORS.green}22` : "none"}">${ICONS.arrowUp}</button>
          <input id="label-input" class="add-input" placeholder="Libellé (facultatif)" value="${escapeHtml(state.label)}" />
          <button id="btn-minus" class="action-btn ${amountEnabled ? "enabled" : ""}" style="background:${amountEnabled ? COLORS.coral : "#1E2635"};color:${amountEnabled ? "#0A0E16" : "#8892A4"};box-shadow:${amountEnabled ? `0 0 0 3px ${COLORS.coral}22` : "none"}">${ICONS.arrowDown}</button>
        </div>
        <div class="hint-row">
          <span class="hint">+ ajoute direct en entrée</span>
          <span class="hint">− ajoute direct en sortie</span>
        </div>

        <input id="amount-input" class="amount-input" placeholder="Montant" inputmode="decimal" value="${escapeHtml(state.amount)}" />

        <div class="tags-row">
          ${state.tags.map((t) => {
            const active = state.activeTag === t;
            const color = TAG_COLORS[t] || COLORS.green;
            return `<button class="tag-btn" data-tag="${escapeHtml(t)}" style="border-color:${active ? color : "#1E2635"};background:${active ? color + "1a" : "transparent"};color:${active ? color : "#8892A4"}">#${escapeHtml(t)}</button>`;
          }).join("")}
          <button id="new-tag-btn" class="tag-btn dashed">+ Nouveau</button>
        </div>
      </div>

      ${renderDonut()}

      <div class="quote">« Savoir ce qu'il te reste, simplement. »</div>
    </div>

    <div class="bottomnav">
      <div class="navicon active">${ICONS.home}<span>Accueil</span></div>
      <div class="navicon">${ICONS.history}<span>Historique</span></div>
      <div class="navicon">${ICONS.tag}<span>Catégories</span></div>
      <div class="navicon">${ICONS.settings}<span>Paramètres</span></div>
    </div>
  `;

  document.getElementById("root").innerHTML = html;
  wireEvents();
}

function wireEvents() {
  document.querySelectorAll(".period-tab").forEach((btn) => {
    btn.addEventListener("click", () => setPeriod(btn.dataset.period));
  });

  document.getElementById("nav-prev").addEventListener("click", () => navPeriod(-1));
  document.getElementById("nav-next").addEventListener("click", () => navPeriod(1));

  document.getElementById("btn-plus").addEventListener("click", () => pressAndSubmit("in", "btn-plus"));
  document.getElementById("btn-minus").addEventListener("click", () => pressAndSubmit("out", "btn-minus"));

  const labelInput = document.getElementById("label-input");
  labelInput.addEventListener("input", (e) => onLabelInput(e.target.value));

  const amountInput = document.getElementById("amount-input");
  amountInput.addEventListener("input", (e) => onAmountInput(e.target.value));

  document.querySelectorAll(".tag-btn[data-tag]").forEach((btn) => {
    btn.addEventListener("click", () => pickTag(btn.dataset.tag));
  });

  document.getElementById("new-tag-btn").addEventListener("click", newTag);
}

render();
</script>
</body>
</html>
